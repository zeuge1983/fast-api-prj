# Pytest configuration lives at the repo root so that:
#   - `pytest`, `pytest tests/`, and `python -m pytest` all find it
#   - rootdir stays the project root, which keeps `from app... import` working
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: no model, no network, milliseconds",
    "live: needs a uvicorn server running on 127.0.0.1:8000",
    "contract: calls the real local model, slow",
    "eval: scores output quality, opt-in only",
]
# Fast by default. Anything slow or non-deterministic is opt-in via -m.
addopts = "-m 'not live and not contract and not eval' --strict-markers"

# Run with a bare `mypy` from the repo root.
[tool.mypy]
python_version = "3.13"
files = ["app", "scripts"]
# Teaches mypy about Pydantic's generated __init__ (field names, types).
plugins = ["pydantic.mypy"]
# By default mypy silently skips any function without annotations.
# These two turn "missing signature" into an error:
#   untyped_defs    -> def f(x):            (no annotations at all)
#   incomplete_defs -> def f(x: int):       (some annotations, e.g. no return type)
disallow_untyped_defs = true
disallow_incomplete_defs = true
